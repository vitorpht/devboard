<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DevBoard — A modern productivity dashboard for developers."
    />
    <title>DevBoard — Productivity Dashboard</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom styles -->
    <link rel="stylesheet" href="src/css/styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
    <!-- Mobile sidebar overlay -->
    <div
      id="sidebar-overlay"
      class="sidebar-overlay fixed inset-0 z-40 hidden bg-slate-900/50 lg:hidden"
      aria-hidden="true"
    ></div>

    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside
        id="sidebar"
        class="sidebar fixed inset-y-0 left-0 z-50 flex w-64 -translate-x-full flex-col border-r border-slate-200 bg-white transition-transform duration-300 ease-in-out lg:static lg:translate-x-0"
        aria-label="Main navigation"
      >
        <!-- Sidebar brand -->
        <div class="flex h-16 items-center gap-3 border-b border-slate-200 px-5">
          <div
            class="flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-600"
            aria-hidden="true"
          >
            <svg
              class="h-5 w-5 text-white"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"
              />
            </svg>
          </div>
          <span class="text-lg font-bold tracking-tight text-slate-900">DevBoard</span>
        </div>

        <!-- Sidebar navigation -->
        <nav class="flex-1 space-y-1 px-3 py-4" aria-label="Sidebar menu">
          <a
            href="#"
            class="sidebar-link flex items-center gap-3 rounded-lg bg-indigo-50 px-3 py-2.5 text-sm font-medium text-indigo-700"
            aria-current="page"
          >
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
            </svg>
            Dashboard
          </a>
          <a
            href="#"
            class="sidebar-link flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900"
          >
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
            </svg>
            Tasks
          </a>
          <a
            href="#"
            class="sidebar-link flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900"
          >
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
            </svg>
            Projects
          </a>
        </nav>

        <!-- Sidebar footer -->
        <div class="border-t border-slate-200 px-5 py-4">
          <p class="text-xs text-slate-400">DevBoard v1.0</p>
        </div>
      </aside>

      <!-- Main column -->
      <div class="flex min-w-0 flex-1 flex-col">
        <!-- Top navigation bar -->
        <header
          class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-slate-200 bg-white/80 px-4 backdrop-blur-md sm:px-6"
        >
          <div class="flex items-center gap-3">
            <!-- Mobile menu button -->
            <button
              id="sidebar-toggle"
              type="button"
              class="inline-flex items-center justify-center rounded-lg p-2 text-slate-500 hover:bg-slate-100 hover:text-slate-700 lg:hidden"
              aria-label="Toggle sidebar"
              aria-expanded="false"
              aria-controls="sidebar"
            >
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
            <h1 class="text-lg font-semibold text-slate-900 sm:text-xl">DevBoard</h1>
          </div>

          <!-- Theme toggle placeholder -->
          <button
            id="theme-toggle"
            type="button"
            class="inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-600 shadow-sm hover:bg-slate-50 hover:text-slate-900"
            aria-label="Toggle theme (coming soon)"
            disabled
          >
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
            <span class="hidden sm:inline">Theme</span>
          </button>
        </header>

        <!-- Main dashboard content -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
          <!-- Page header -->
          <div class="mb-6 sm:mb-8">
            <h2 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">
              Dashboard
            </h2>
            <p class="mt-1 text-sm text-slate-500 sm:text-base">
              Welcome back. Here is an overview of your workspace.
            </p>
          </div>

          <!-- Statistics cards -->
          <section
            id="stats"
            class="mb-6 grid grid-cols-1 gap-4 sm:mb-8 sm:grid-cols-2 sm:gap-5 xl:grid-cols-4"
            aria-label="Dashboard statistics"
          >
            <!-- Total Tasks -->
            <article class="stat-card rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
              <div class="flex items-center justify-between">
                <p class="text-sm font-medium text-slate-500">Total Tasks</p>
                <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-50 text-indigo-600" aria-hidden="true">
                  <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                  </svg>
                </div>
              </div>
              <p class="stat-value mt-3 text-3xl font-bold text-slate-900" data-stat="total">0</p>
            <article class="stat-card rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
              <div class="flex items-center justify-between">
                <p class="text-sm font-medium text-slate-500">Pending Tasks</p>
                <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-amber-50 text-amber-600" aria-hidden="true">
                  <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </div>
              </div>
              <p class="stat-value mt-3 text-3xl font-bold text-slate-900" data-stat="pending">0</p>
            <article class="stat-card rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
              <div class="flex items-center justify-between">
                <p class="text-sm font-medium text-slate-500">Completed Tasks</p>
                <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-emerald-50 text-emerald-600" aria-hidden="true">
                  <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </div>
              </div>
              <p class="stat-value mt-3 text-3xl font-bold text-slate-900" data-stat="completed">0</p>
            <article class="stat-card rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
              <div class="flex items-center justify-between">
                <p class="text-sm font-medium text-slate-500">Active Projects</p>
                <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-violet-50 text-violet-600" aria-hidden="true">
                  <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                  </svg>
                </div>
              </div>
              <p class="stat-value mt-3 text-3xl font-bold text-slate-900">0</p>
            </article>
          </section>

          <!-- Task management -->
          <section
            id="tasks-section"
            class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm"
            aria-label="Task management"
          >
            <div class="mb-6">
              <h3 class="text-lg font-semibold text-slate-900">Tasks</h3>
              <p class="mt-1 text-sm text-slate-500">Create and manage your tasks.</p>
            </div>

            <!-- Task creation form -->
            <form id="task-form" class="mb-8 space-y-4" novalidate>
              <div
                id="task-form-error"
                class="hidden rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
                role="alert"
              ></div>

              <div>
                <label for="task-title" class="mb-1.5 block text-sm font-medium text-slate-700">
                  Title <span class="text-red-500">*</span>
                </label>
                <input
                  type="text"
                  id="task-title"
                  name="title"
                  required
                  placeholder="Enter task title"
                  class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                />
              </div>

              <div>
                <label for="task-description" class="mb-1.5 block text-sm font-medium text-slate-700">
                  Description
                </label>
                <textarea
                  id="task-description"
                  name="description"
                  rows="3"
                  placeholder="Enter task description (optional)"
                  class="w-full resize-none rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                ></textarea>
              </div>

              <div>
                <label for="task-priority" class="mb-1.5 block text-sm font-medium text-slate-700">
                  Priority
                </label>
                <select
                  id="task-priority"
                  name="priority"
                  class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
                >
                  <option value="Low">Low</option>
                  <option value="Medium" selected>Medium</option>
                  <option value="High">High</option>
                </select>
              </div>

              <button
                type="submit"
                class="inline-flex items-center justify-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
              >
                Create Task
              </button>
            </form>

            <!-- Task list -->
            <div>
              <h4 class="mb-4 text-sm font-semibold uppercase tracking-wide text-slate-500">
                Task List
              </h4>

              <div
                id="task-list-empty"
                class="flex min-h-[120px] items-center justify-center rounded-lg border-2 border-dashed border-slate-200 bg-slate-50"
              >
                <p class="text-sm text-slate-400">No tasks yet. Create your first task above.</p>
              </div>

              <ul id="task-list" class="space-y-3" aria-live="polite"></ul>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- JavaScript modules (load order matters) -->
    <script src="src/js/storage.js"></script>
    <script src="src/js/tasks.js"></script>
    <script src="src/js/projects.js"></script>
    <script src="src/js/theme.js"></script>
    <script src="src/js/app.js"></script>
  </body>
</html>
